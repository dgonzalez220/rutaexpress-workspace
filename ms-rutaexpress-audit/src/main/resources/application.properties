spring.application.name=ms-rutaexpress-audit
server.port=8086

# ==========================================
# CONFIGURACIÓN DE ORACLE DATABASE
# ==========================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:ORCL
spring.datasource.username=tu_usuario_oracle
spring.datasource.password=tu_contraseña_oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ==========================================
# CONFIGURACIÓN DE KAFKA (CONSUMIDOR)
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*